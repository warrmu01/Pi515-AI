<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Predict Weekly Survival Rates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Litepicker CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/predict.css" />
  </head>

  <body>
    <!-- Back to Home Button -->
    <div class="container py-4">
      <a href="index.html" class="back-home-btn">&larr; Back to Home</a>
    </div>

    <!-- Main Section -->
    <div class="container d-flex flex-column align-items-center">
      <!-- Prediction Bar -->
      <div
        class="predict-bar d-flex justify-content-between align-items-center gap-3 mb-4 flex-wrap"
      >
        <!-- Date Picker -->
        <input
          type="text"
          id="date-range-picker"
          class="predict-input flex-grow-1"
          placeholder="Select date range"
          readonly
        />

        <!-- Fish Count -->
        <input
          type="number"
          id="fish-count"
          class="predict-input flex-grow-1"
          placeholder="Fish count"
          min="0"
        />

        <!-- Predict Button -->
        <button id="predictButton" class="predict-btn flex-grow-1">
          Predict
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            width="20"
            height="20"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>
      </div>

      <!-- Prediction Result Card -->
      <div
        id="predictionCard"
        class="predict-result-card p-4 text-center"
        style="display: none"
      >
        <div class="row">
          <div class="col-md-6 mb-3 mb-md-0" id="predictionLeft"></div>
          <div class="col-md-6" id="predictionRight"></div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/bundle.js"></script>
    <script src="js/predict.js"></script>
  </body>
</html>

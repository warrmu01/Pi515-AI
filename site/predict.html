<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Predict Weekly Survival Rates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Litepicker CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/predict.css" />
  </head>
  <body>
    <div class="container py-4">
      <a href="index.html" class="btn btn-outline-dark rounded-pill">
        &larr; Back to Home
      </a>
    </div>

    <div class="container">
      <div class="predict-card mx-auto" style="max-width: 500px">
        <div class="text-center mb-4">
          <h5 class="fw-bold">Predict Survival Rate</h5>
        </div>

        <!-- Single Range Picker Input -->
        <div class="d-flex flex-column align-items-center gap-3">
          <input
            type="text"
            id="date-range-picker"
            class="form-control text-center"
            placeholder="Select date range"
            readonly
            style="cursor: pointer"
          />

          <!-- Predict Button -->
          <button
            class="predict-btn btn btn-primary rounded-pill px-4"
            id="predictButton"
          >
            <span>Predict</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              class="ms-2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Prediction Result Card (initially hidden) -->
      <div class="row justify-content-center mt-5">
        <div class="col-md-8">
          <div
            id="predictionCard"
            class="card p-4 shadow text-center"
            style="display: none"
          >
            <div class="row">
              <div class="col-md-6 mb-3 mb-md-0" id="predictionLeft"></div>
              <div class="col-md-6" id="predictionRight"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Litepicker JS -->
    <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/bundle.js"></script>

    <!-- Custom JS -->
    <script src="js/predict.js"></script>
  </body>
</html>
